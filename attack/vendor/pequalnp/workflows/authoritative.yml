# AUTHORITATIVE check of one pull request. Started by hand (workflow_dispatch) from the base
# repository, with the pull request number and the gap id. Its verdict is the one that counts.
#
# The rule behind every guard below: the only thing taken from the pull request is the bytes of
# one Lean file. The fork is never checked out. Nothing from it runs, except that Lean compiles
# that one file, and a Lean file can run code while it compiles. So that compile is treated as
# hostile: it runs as a separate account that cannot write the checker, the verifier, the pinned
# library, the definitions or the statement, cannot reach the network, and never sees the
# GitHub credential of this run (.github/scripts/lake-locked.sh).
name: authoritative

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      gap:
        description: Gap id, for example L-gct-101
        required: true
        type: string

# Least privilege: read the code and read the pull request. This run cannot write anything.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: authoritative-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Inputs are free text typed by whoever starts the run. They reach the scripts only as
      # environment variables, and the next step refuses anything but digits and a plain id.
      # They are never pasted into a script with the workflow's own expression syntax.
      PR: ${{ inputs.pr }}
      GAP: ${{ inputs.gap }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GAPS_URL: https://data.pequalnp.com/data/desk/gaps.json
      API: https://api.github.com
      W: /opt/pnp
    steps:
      - name: Refuse malformed inputs and a run from another branch
        run: |
          set -eu
          # steps.log keeps what the guard steps print, for the verdict step. Only this account
          # can read or write it (0600), and only the steps that run BEFORE any outside code
          # write to it: this one and the three guard steps below.
          ( umask 077; : > "$RUNNER_TEMP/steps.log" ); chmod 600 "$RUNNER_TEMP/steps.log"
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1
          printf '%s' "$PR" | grep -Eqx '[1-9][0-9]{0,6}' || { echo "REFUSED: pr must be a number"; exit 1; }
          printf '%s' "$GAP" | grep -Eqx 'L-[a-z0-9]+(-[a-z0-9]+)*' || { echo "REFUSED: gap must look like L-gct-101"; exit 1; }
          [ "${#GAP}" -le 64 ] || { echo "REFUSED: gap id too long"; exit 1; }
          # Only the default branch holds the checker and this file as they were reviewed.
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "REFUSED: start this run from $DEFAULT_BRANCH"; exit 1; }
          sudo mkdir -p "$W" && sudo chown "$(id -u):$(id -g)" "$W"
          mkdir -p "$W/in" "$W/api"

      - name: Check out the BASE only (plain git, no stored credentials)
        run: |
          set -eu
          # No checkout action: plain git leaves no credential in .git for later steps to find.
          git init -q "$W/base"
          git -C "$W/base" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$W/base" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$W/base" rev-parse HEAD)" = "$GITHUB_SHA" ]
          echo "base commit: $GITHUB_SHA"

      - name: Read the pull request through the API and refuse anything but one added proof file
        env:
          # The credential of this run, read only, given to this step and the next one alone.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1   # kept for the verdict step
          get() { curl -sSf --proto '=https' --max-redirs 0 --max-filesize 20000000 \
                    -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" -o "$2" "$API/repos/$GITHUB_REPOSITORY/$1"; }
          get "pulls/$PR" "$W/api/pr.json"
          get "pulls/$PR/files?per_page=100" "$W/api/files.json"
          # The head commit, as a 40 character hash, before it is used in a URL.
          head=$(jq -r '.head.sha // ""' "$W/api/pr.json")
          printf '%s' "$head" | grep -Eqx '[0-9a-f]{40}' || { echo "REFUSED: the pull request has no head commit"; exit 1; }
          # The whole tree of the head commit: it says whether the file is a plain file or a link.
          get "git/trees/$head?recursive=1" "$W/api/tree.json"
          # One place decides: exactly one file, added, under lean/PEqualNP/Outside/, the allowed
          # name (so no path can climb out with ..), a plain file, at most 512 KiB, nothing else.
          node "$W/base/.github/scripts/outside-guard.mjs" pr "$W/api/pr.json" "$W/api/files.json" "$W/api/tree.json" \
            "$GITHUB_REPOSITORY" "$DEFAULT_BRANCH" "$W/in"
          [ ! -e "$W/base/$(cat "$W/in/pr.file")" ] || { echo "REFUSED: the file already exists in the base"; exit 1; }

      - name: Download that one file as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1   # kept for the verdict step
          blob=$(cat "$W/in/pr.blob")
          # The content is fetched by its hash, as bytes, into a plain file this run creates.
          # Whatever the pull request made of the path (a link, a mode), only bytes arrive.
          curl -sSf --proto '=https' --max-redirs 0 --max-filesize 524288 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -o "$W/in/proof.lean" "$API/repos/$GITHUB_REPOSITORY/git/blobs/$blob"
          [ "$(wc -c < "$W/in/proof.lean")" -le 524288 ] || { echo "REFUSED: the file is larger than 512 KiB"; exit 1; }
          # The bytes must be the ones the pull request names.
          [ "$(git hash-object "$W/in/proof.lean")" = "$blob" ] || { echo "REFUSED: the downloaded bytes are not the file of the pull request"; exit 1; }

      - name: The posted statement for the gap, and the import rule
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1   # kept for the verdict step
          # The statement comes from the desk's public list, never from the pull request.
          curl -sSf --proto '=https' --max-redirs 0 --max-filesize 5000000 -o "$W/in/gaps.json" "$GAPS_URL"
          node "$W/base/.github/scripts/outside-guard.mjs" gap "$W/in/gaps.json" "$GAP" "$(cat "$W/in/pr.file")" "$W/in"
          # Before anything is built: the file may import Mathlib and the modules the gap lists.
          node "$W/base/.github/scripts/outside-guard.mjs" imports "$W/in/proof.lean" "$W/in/imports.json"

      - name: Install the pinned Lean toolchain
        run: |
          set -eu
          export ELAN_HOME="$W/elan"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          "$ELAN_HOME/bin/elan" toolchain install "$(cat "$W/base/lean/lean-toolchain")"
          cd "$W/base/lean"
          # The real binaries of the pinned toolchain, so the check does not depend on a launcher.
          tc=$(dirname "$("$ELAN_HOME/bin/elan" which lake)")
          [ -x "$tc/lake" ] && [ -x "$tc/lean" ]
          echo "TC_BIN=$tc" >> "$GITHUB_ENV"

      - name: Fetch the prebuilt Mathlib and build the trusted parts
        run: |
          set -eu
          cd "$W/base/lean"
          export PATH="$TC_BIN:$PATH" PEQUALNP_REAL_LAKE="$TC_BIN/lake" PEQUALNP_HOME="$W/queue" LAKE_ARTIFACT_CACHE=false
          "$TC_BIN/lake" exe cache get
          # Base code only: the verifier, the definitions, and the modules the gap lets the file
          # import. The proof file is not in the tree yet, so nothing of it is compiled here.
          # The whole of Mathlib is named too: the cache does not carry every hash file Lake
          # keeps beside a module, and Lake writes a missing one the first time it replays that
          # module. That must happen here, as this account, because the locked account cannot
          # write under the library (it failed there on two modules: permission denied).
          set -- checklemma +Mathlib +PEqualNP.Defs
          while IFS= read -r m; do if [ -n "$m" ]; then set -- "$@" "+$m"; fi; done < "$W/in/imports.txt"
          ../tools/bin/lake build "$@"

      - name: Swap space for the verifier
        run: |
          set -eu
          # The verifier loads the library more than once in one process, and only the first
          # load is shared with the files on disk: for a proof that imports all of Mathlib it
          # needs more memory than a standard runner has. Without swap it starves the runner
          # (the run hangs and its log is lost). The swap file belongs to root, mode 0600.
          # The disk has no room for it until toolsets this run never uses are removed.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          # As large as the emptier disk allows while 6 GB of it stay free, at most 12 GB.
          df -m / /mnt 2>/dev/null || true
          d=$(df -m --output=avail,target / /mnt 2>/dev/null | awk 'NR>1' | sort -rn | awk 'NR==1{print $2}')
          mb=$(( $(df -m --output=avail "$d" | awk 'NR==2{print $1}') - 6144 ))
          [ "$mb" -le 12288 ] || mb=12288
          if [ "$mb" -ge 1024 ]; then
            f="${d%/}/pnp-swap"
            sudo fallocate -l "${mb}M" "$f" && sudo chmod 600 "$f"
            sudo mkswap -q "$f" && sudo swapon "$f"
          fi
          free -m

      - name: Put the file in place and lock the tree
        run: |
          set -eu
          file=$(cat "$W/in/pr.file")
          install -m 0644 "$W/in/proof.lean" "$W/base/$file"
          # git refuses a tree owned by another account unless told the tree is safe.
          printf '[safe]\n\tdirectory = *\n' > "$W/in/gitconfig"
          # The account the hostile compile runs as. It has no sudo and owns almost nothing.
          sudo useradd --system --create-home --shell /usr/sbin/nologin outsider
          # Nothing under $W is writable by that account ...
          chmod -R a+rX,go-w "$W"
          # ... except the output directories of its own module. It cannot create a file
          # anywhere else in the tree, so it cannot plant a setting, a package or a library.
          for d in lib/lean ir; do
            mkdir -p "$W/base/lean/.lake/build/$d/PEqualNP/Outside"
            sudo chown outsider:outsider "$W/base/lean/.lake/build/$d/PEqualNP/Outside"
          done
          # What the verdict will be about, hashed before the hostile step runs.
          ( cd "$W" && sha256sum "base/$file" in/statement.txt base/tools/check-lean.mjs base/tools/build.sh \
              base/tools/bin/lake base/lean/CheckLemma.lean base/lean/.lake/build/bin/checklemma \
              base/.github/scripts/lake-locked.sh ) | tee "$RUNNER_TEMP/before.sha256"

      - name: Run the BASE checker on the file (the only step that runs outside code)
        id: run
        # A backstop only: the checker's own limit below (20 minutes) ends it first, with a
        # recorded exit code, so the verdict step reports a FAULT and prints what it was doing.
        timeout-minutes: 25
        run: |
          # The checker's exit code is read below, so a nonzero one must not end this step.
          set +e -u
          file=$(cat "$W/in/pr.file")
          # What the machine was doing, every 30 s, kept for the verdict step: the busiest
          # processes, memory and swap, swap and disk traffic, memory pressure, which builds have
          # finished. Written by this account into a directory closed to every other one. The
          # process list can show arguments of the locked build, so the verdict step prints it
          # only quoted.
          mkdir -m 700 "$RUNNER_TEMP/sampler"
          t0=$(date +%s)
          ( while sleep 30; do
              echo "--- t=$(( $(date +%s) - t0 ))s"
              ps -eo user:10,etime,pcpu,rss,args --sort=-pcpu | head -5 | cut -c1-200
              free -m | sed -n 2,3p
              vmstat 1 2 | tail -1 | awk '{print "swap in/out " $7 "/" $8 " KB/s, disk in/out " $9 "/" $10 " blocks/s, iowait " $16 "%"}'
              head -n 1 /proc/pressure/memory 2>/dev/null
              cat "$RUNNER_TEMP"/builds/*/cmd 2>/dev/null
            done ) > "$RUNNER_TEMP/sampler/log" 2>&1 &
          sampler=$!
          node_bin=$(dirname "$(readlink -f "$(command -v node)")")
          cd "$W/base"
          # Full build output, kept by lake-locked.sh. Created and owned by this account, closed
          # to every other one: the locked account can neither list, read nor create files in it.
          mkdir -m 700 "$RUNNER_TEMP/builds"
          # The same command the project's own records are made with:
          #   node tools/check-lean.mjs <lean file> <statement file> check
          # The environment is emptied, so no credential of this run is in it. The checker and
          # the verifier run as this run's account. Every build goes through lake-locked.sh and
          # runs as `outsider` (see that file). The compile is another account than the checker,
          # so it cannot signal it, read or write its memory, or write to its output files.
          # The checker and everything it starts, the locked compile included, run inside one
          # memory limit below the machine's memory. What they need beyond it goes to swap,
          # instead of starving the runner itself, which loses the log and leaves the run hanging.
          # The same machine for every run, whatever runner GitHub hands out: two cores and at
          # most 6.5 GB of memory (the rest goes to swap). That is the 2 core, 8 GB runner on
          # which honest proofs that import all of Mathlib are accepted in about 7 minutes. On
          # the 4 core, 16 GB runner a limit of the machine's memory less 1.5 GB starved the
          # runner itself: the run lost contact with GitHub after 45 minutes and left no log.
          cap=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) - 1572864 ))
          [ "$cap" -le 6815744 ] || cap=6815744
          echo "memory: $(awk '/^MemTotal:/{print $2}' /proc/meminfo) kB, limit for the checker: $cap kB"
          sudo systemd-run --quiet --scope --collect -p MemoryMax="${cap}K" \
              --uid="$(id -u)" --gid="$(id -g)" \
          taskset -c 0,1 env -i HOME="$HOME" LANG=C.UTF-8 PATH="$TC_BIN:$node_bin:/usr/bin:/bin" \
              PEQUALNP_REAL_LAKE="$W/base/.github/scripts/lake-locked.sh" PEQUALNP_HOME="$W/queue" \
              PNP_TC_BIN="$TC_BIN" PNP_GITCONFIG="$W/in/gitconfig" PNP_BUILD_LOGS="$RUNNER_TEMP/builds" \
            timeout -k 30 1200 node "$W/base/tools/check-lean.mjs" "$W/base/$file" "$W/in/statement.txt" check \
            > "$RUNNER_TEMP/checker.out" 2> "$RUNNER_TEMP/checker.err"
          code=$?
          kill "$sampler" 2>/dev/null
          # 124 or 137: the 20 minute limit ended the checker. A FAULT, never a verdict on the proof.
          case "$code" in 124|137) echo "the checker was stopped after 20 minutes" >> "$RUNNER_TEMP/checker.err" ;; esac
          # Nothing the compile started may outlive it, and neither may the verifier.
          sudo pkill -KILL -u outsider || true
          pkill -KILL -f "$W/base/lean/.lake/build/bin/checklemma" || true
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Print the checker's last line, MANIFEST, and the verdict
        # Always: whatever stopped the run, its last step says why in one place.
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          RAN: ${{ steps.run.outcome }}
        run: |
          set -u
          # Everything below that a pull request can influence (the checker's output, the build
          # output, a guard's reason) is printed ONLY through quoted, between stop-commands and
          # its resume token: control characters removed, every line cut and prefixed with
          # "  | ". So no such line can be a workflow command, and none can start with
          # VERDICT. The verdict is the job's conclusion and the VERDICT line this step writes
          # itself, to the log and to the step summary, from $CODE and the checks below.
          quoted() { tr -d '\000-\010\013-\037\177' | cut -c1-2000 | sed 's/^/  | /'; }
          stop="stop-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          if [ -z "$CODE" ] && [ "$RAN" != skipped ] && [ -n "$RAN" ]; then
            # The checker's step started and recorded no exit code: it was stopped (its time
            # limit, or the run was cancelled). No verdict. What it was doing is printed quoted.
            echo "::stop-commands::$stop"
            for b in "$RUNNER_TEMP"/builds/*/; do
              [ -d "$b" ] || continue
              echo "----- a build's output (tail) -----"
              cat "$b/cmd" 2>/dev/null | quoted; tail -n 15 "$b/out" | quoted; tail -n 15 "$b/err" | quoted
            done
            tail -n 15 "$RUNNER_TEMP/checker.err" 2>/dev/null | quoted
            echo "----- the machine, last samples -----"
            tail -n 40 "$RUNNER_TEMP/sampler/log" 2>/dev/null | quoted
            echo "::$stop::"
            echo "VERDICT: FAULT (the checker's step was stopped before it finished: $RAN. This says nothing about the proof.)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          if [ -z "$CODE" ]; then
            # The checker's step never started, so no outside code ran. steps.log was written
            # only by the guard steps before that step, as this account (0600). A REFUSED
            # line in it is a guard's refusal of the pull request; without one, the run itself
            # failed, which says nothing of the proof.
            if grep -aq '^REFUSED' "$RUNNER_TEMP/steps.log" 2>/dev/null; then
              echo "::stop-commands::$stop"
              grep -a '^REFUSED' "$RUNNER_TEMP/steps.log" | tail -n 1 | quoted
              echo "::$stop::"
              echo "VERDICT: REFUSED (before any build; the reason is the quoted line above)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "VERDICT: FAULT (the run stopped before the checker started; the failed step above says where. This says nothing about the proof.)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          file=$(cat "$W/in/pr.file")
          # The trusted files must be what they were before the hostile step.
          ( cd "$W" && sha256sum "base/$file" in/statement.txt base/tools/check-lean.mjs base/tools/build.sh \
              base/tools/bin/lake base/lean/CheckLemma.lean base/lean/.lake/build/bin/checklemma \
              base/.github/scripts/lake-locked.sh ) > "$RUNNER_TEMP/after.sha256"
          same=yes; cmp -s "$RUNNER_TEMP/before.sha256" "$RUNNER_TEMP/after.sha256" || same=no
          last=$(tail -n 1 "$RUNNER_TEMP/checker.out")
          manifests=$(grep -c '^MANIFEST {' "$RUNNER_TEMP/checker.out" || true)
          # The one line the hub records an outside proof from: which gap, pull request and file
          # this run judged, and the sha256 of that file and of the statement as hashed BEFORE the
          # outside step ran (before.sha256). The statement hash is of in/statement.txt, the
          # posted text byte for byte with no newline added, which is the form the hub hashes.
          # Every value was validated or computed by this run, and jq builds the JSON. It is
          # printed unquoted and before the quoted block, so no quoted line can pass for it.
          fsha=$(awk -v p="base/$file" '$2 == p { print $1 }' "$RUNNER_TEMP/before.sha256")
          ssha=$(awk '$2 == "in/statement.txt" { print $1 }' "$RUNNER_TEMP/before.sha256")
          if printf '%s %s' "$fsha" "$ssha" | grep -Eqx '[0-9a-f]{64} [0-9a-f]{64}'; then
            echo "OUTSIDE $(jq -cn --arg lemma "$GAP" --argjson pr "$PR" --arg file "$file" --arg f "$fsha" --arg s "$ssha" \
              '{lemma: $lemma, pr: $pr, file: $file, file_sha256: $f, statement_sha256: $s}')"
          fi
          # The output can quote the proof file. It is printed with workflow commands switched
          # off, so a line in it cannot pass for an instruction to the runner.
          echo "::stop-commands::$stop"
          echo "----- checker diagnostics (first lines, then tail) -----"
          head -n 3 "$RUNNER_TEMP/checker.err" | quoted
          tail -n 30 "$RUNNER_TEMP/checker.err" | quoted
          # The checker passes on only the last lines of a failed build. The first errors of
          # each build that failed are printed here from the full output lake-locked.sh kept.
          for b in "$RUNNER_TEMP"/builds/*/; do
            [ -f "$b/cmd" ] || continue
            grep -q '(exit 0)$' "$b/cmd" && continue
            echo "----- first errors of a build that failed -----"
            cat "$b/cmd" "$b/out" "$b/err" | grep -av 'designed for use with the module system' \
              | grep -a -m 8 -A 15 -E '^lake |^error|^✖|: error' | quoted
          done
          tail -n 40 "$RUNNER_TEMP/checker.out" | grep -av '^MANIFEST {' | quoted
          if [ "$CODE" != 0 ] && [ "$CODE" != 1 ]; then
            echo "----- the machine, last samples -----"
            tail -n 40 "$RUNNER_TEMP/sampler/log" 2>/dev/null | quoted
          fi
          echo "----- MANIFEST -----"
          grep -a '^MANIFEST {' "$RUNNER_TEMP/checker.out" | cut -c1-200000 | sed 's/^/  | /' || true
          echo "----- last line -----"
          printf '%s\n' "$last" | quoted
          echo "::$stop::"
          echo "----- what was checked -----"
          echo "pull request: $PR   gap: $GAP   author (credit): $(cat "$W/in/pr.author")"
          echo "head commit: $(cat "$W/in/pr.head")   file: $file   content hash: $(cat "$W/in/pr.blob")"
          echo "base commit: $GITHUB_SHA   statement sha256: $(sha256sum "$W/in/statement.txt" | cut -d' ' -f1)"
          echo "Merge only while the pull request's head is still the head commit above."
          # ACCEPTED needs all of: exit 0, an ACCEPTED last line, one MANIFEST line, untouched files.
          verdict=FAULT
          case "$CODE" in
            0) case "$last" in "ACCEPTED (check)"*) [ "$manifests" = 1 ] && [ "$same" = yes ] && verdict=ACCEPTED ;; esac ;;
            1) case "$last" in REJECTED*) verdict=REJECTED ;; esac ;;
          esac
          echo "VERDICT: $verdict (checker exit $CODE)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = ACCEPTED ] && exit 0
          [ "$verdict" = REJECTED ] && exit 1
          exit 3
